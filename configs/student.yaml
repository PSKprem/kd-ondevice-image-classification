# P25 — MobileNetV2 student baseline (NO knowledge distillation)
# Usage: python -m src.train --config configs/student.yaml --width-mult 0.5

run_name: student_mbv2_cifar100_v2

# ---- data ----
dataset: cifar100
data_root: D:/kd-project/data
plantvillage_dir: D:/kd-project/data/plantvillage
image_size: 128
num_workers: 8
val_per_class: 50          # 45k train / 5k val, stratified (50 val images per class)
split_seed: 42              # fixed: split must NOT depend on the training seed

# ---- model ----
model: mobilenetv2
pretrained: true           # ImageNet weights exist for MobileNetV2 w0.5 / 1.0 / 1.4 and MobileNetV3-Small
width_mult: 1.0            # main sweep: 0.5 / 1.0 / 1.4 via --width-mult (0.35/0.75 only with --no-pretrained)

# ---- optimization ----
epochs: 20
batch_size: 128
optimizer: sgd
lr: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: cosine
warmup_epochs: 1
label_smoothing: 0.0

# ---- runtime ----
amp: true
seed: 42                   # SAME seed as KD runs for fair comparison
out_dir: D:/kd-project/runs_v2
results_csv: results/results_v2.csv
save_every: 1
